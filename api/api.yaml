{
   "components": {
      "parameters": {
         "otelcolId": {
            "description": "otelcol id",
            "in": "path",
            "name": "id",
            "required": true,
            "schema": {
               "type": "string"
            }
         }
      },
      "responses": {
         "Error": {
            "content": {
               "application/problem+json": {
                  "schema": {
                     "$ref": "#/components/schemas/Error"
                  }
               }
            },
            "description": "Error"
         }
      },
      "schemas": {
         "Error": {
            "additionalProperties": false,
            "properties": {
               "detail": {
                  "description": "A human-readable explanation specific to this occurrence of the problem.",
                  "example": "Property foo is required but is missing.",
                  "type": "string"
               },
               "errors": {
                  "description": "Optional list of individual error details",
                  "items": {
                     "$ref": "#/components/schemas/ErrorDetail"
                  },
                  "nullable": true,
                  "type": "array"
               },
               "instance": {
                  "description": "A URI reference that identifies the specific occurrence of the problem.",
                  "example": "https://example.com/error-log/abc123",
                  "format": "uri",
                  "type": "string"
               },
               "status": {
                  "description": "HTTP status code",
                  "example": 400,
                  "format": "int64",
                  "type": "integer"
               },
               "title": {
                  "description": "A short, human-readable summary of the problem type. This value should not change between occurrences of the error.",
                  "example": "Bad Request",
                  "type": "string"
               },
               "type": {
                  "default": "about:blank",
                  "description": "A URI reference to human-readable documentation for the error.",
                  "example": "https://example.com/errors/example",
                  "format": "uri",
                  "type": "string"
               }
            },
            "required": [
               "detail",
               "instance",
               "title",
               "type",
               "status"
            ],
            "type": "object"
         },
         "ErrorDetail": {
            "additionalProperties": false,
            "properties": {
               "location": {
                  "description": "Where the error occurred, e.g. 'body.items[3].tags' or 'path.thing-id'",
                  "type": "string"
               },
               "message": {
                  "description": "Error message text",
                  "type": "string"
               },
               "value": {
                  "description": "The value at the given location"
               }
            },
            "type": "object"
         },
         "Otelcol": {
            "properties": {
               "id": {
                  "readOnly": true,
                  "type": "string"
               },
               "name": {
                  "type": "string"
               }
            },
            "required": [
               "id",
               "name"
            ],
            "type": "object"
         },
         "OtelcolCreate": {
            "properties": {
               "name": {
                  "type": "string"
               }
            },
            "required": [
               "id",
               "name"
            ],
            "type": "object"
         },
         "OtelcolUpdate": {
            "properties": {
               "name": {
                  "type": "string"
               }
            },
            "required": [
               "id",
               "name"
            ],
            "type": "object"
         },
         "Otelcols": {
            "items": {
               "$ref": "#/components/schemas/Otelcol"
            },
            "nullable": true,
            "type": "array"
         }
      },
      "securitySchemes": {
         "cookeAuth": {
            "in": "cookie",
            "name": "ory_kratos_session",
            "type": "apiKey"
         }
      }
   },
   "info": {
      "title": "Telesto API",
      "version": "0.0.0"
   },
   "openapi": "3.0.0",
   "paths": {
      "/api/v1/otelcols": {
         "post": {
            "description": "create a otelcol",
            "operationId": "create-otelcol",
            "requestBody": {
               "content": {
                  "application/json": {
                     "schema": {
                        "$ref": "#/components/schemas/OtelcolCreate"
                     }
                  },
                  "application/x-www-form-urlencoded": {
                     "schema": {
                        "$ref": "#/components/schemas/OtelcolCreate"
                     }
                  }
               },
               "required": true
            },
            "responses": {
               "201": {
                  "description": "created an otelcol",
                  "headers": {
                     "Location": {
                        "schema": {
                           "type": "string"
                        }
                     }
                  }
               },
               "default": {
                  "$ref": "#/components/responses/Error",
                  "x-go-name": "Error"
               }
            },
            "tags": [
               "otelcol"
            ]
         }
      },
      "/api/v1/otelcols/{id}": {
         "delete": {
            "description": "delete an otelcol",
            "operationId": "delete-otelcol",
            "responses": {
               "204": {
                  "description": "delete otelcol"
               },
               "default": {
                  "$ref": "#/components/responses/Error"
               }
            },
            "tags": [
               "otelcol"
            ]
         },
         "parameters": [
            {
               "$ref": "#/components/parameters/otelcolId"
            }
         ],
         "put": {
            "description": "update a single otelcol",
            "operationId": "update-otelcol",
            "requestBody": {
               "content": {
                  "application/json": {
                     "schema": {
                        "$ref": "#/components/schemas/OtelcolUpdate"
                     }
                  },
                  "application/x-www-form-urlencoded": {
                     "schema": {
                        "$ref": "#/components/schemas/OtelcolUpdate"
                     }
                  }
               },
               "required": true
            },
            "responses": {
               "204": {
                  "description": "updated otelcol",
                  "headers": {
                     "Location": {
                        "schema": {
                           "type": "string"
                        }
                     }
                  }
               },
               "default": {
                  "$ref": "#/components/responses/Error"
               }
            },
            "tags": [
               "otelcol"
            ]
         }
      }
   },
   "security": [
      {
         "cookieAuth": [ ]
      }
   ]
}
