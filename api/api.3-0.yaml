components:
  schemas:
    RegisterRequestBody:
      additionalProperties: false
      properties:
        password:
          maximum: 32
          minimum: 8
          type: string
        username:
          format: regex=[a-z1-9_]
          type: string
      required:
        - username
        - password
      type: object
    ErrorDetail:
      additionalProperties: false
      properties:
        location:
          description: Where the error occurred, e.g. 'body.items[3].tags' or 'path.thing-id'
          type: string
        message:
          description: Error message text
          type: string
        value:
          description: The value at the given location
      type: object
    ErrorModel:
      additionalProperties: false
      required:
        - detail
        - instance
        - title
        - type
        - status
      properties:
        detail:
          description: A human-readable explanation specific to this occurrence of the problem.
          example: Property foo is required but is missing.
          type: string
        errors:
          description: Optional list of individual error details
          items:
            $ref: "#/components/schemas/ErrorDetail"
          nullable: true
          type: array
        instance:
          description: A URI reference that identifies the specific occurrence of the problem.
          example: https://example.com/error-log/abc123
          format: uri
          type: string
        status:
          description: HTTP status code
          example: 400
          format: int64
          type: integer
        title:
          description: A short, human-readable summary of the problem type. This value should not change between occurrences of the error.
          example: Bad Request
          type: string
        type:
          default: about:blank
          description: A URI reference to human-readable documentation for the error.
          example: https://example.com/errors/example
          format: uri
          type: string
      type: object
    LoginRequestBody:
      additionalProperties: false
      required:
        - username
        - password
      properties:
        password:
          type: string
        username:
          type: string
      type: object
    LoginResponse:
      additionalProperties: false
      required:
        - username
        - password
      properties:
        password:
          type: string
        username:
          type: string
      type: object
    Otelcol:
      additionalProperties: false
      required:
        - id
        - name
      properties:
        id:
          type: string
        name:
          type: string
      type: object
    OtelcolListResponseBodyItems:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: "#/components/schemas/Otelcol"
          nullable: true
          type: array
      type: object
    OtelcolPostRequestBody:
      additionalProperties: false
      properties:
        name:
          type: string
      type: object
    OtelcolPutRequestBody:
      additionalProperties: false
      properties:
        name:
          type: string
      type: object
    PluginInput:
      additionalProperties: false
      properties:
        applicationSetName:
          type: string
        input:
          $ref: "#/components/schemas/PluginInputParams"
      type: object
    PluginInputParams:
      additionalProperties: false
      properties:
        parameters:
          additionalProperties: {}
          type: object
      type: object
    PluginOutput:
      additionalProperties: false
      properties:
        output:
          $ref: "#/components/schemas/PluginOutputParams"
      type: object
    PluginOutputParams:
      additionalProperties: false
      properties:
        parameters:
          items:
            additionalProperties: {}
            type: object
          nullable: true
          type: array
      type: object
    Token:
      additionalProperties: false
      properties:
        expireAt:
          format: date-time
          type: string
        id:
          type: string
        token:
          type: string
        user:
          $ref: "#/components/schemas/User"
        userId:
          type: string
      type: object
    User:
      additionalProperties: false
      required:
        - id
        - name
        - password
      properties:
        id:
          type: string
        name:
          type: string
        password:
          type: string
      type: object
  securitySchemes:
    cookieAuth:
      in: cookie
      name: telesto_auth
      type: apiKey
    tokenAuth:
      in: header
      name: Authorization
      scheme: Bearer
      type: http
paths:
  /api/v1/otelcol/:
    get:
      operationId: list-otelcol
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OtelcolListResponseBodyItems"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - sessionToken: []
      summary: list otelcol
    post:
      operationId: create-otelcol
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OtelcolPostRequestBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Otelcol"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: create otelcol
  /api/v1/otelcol/{id}:
    delete:
      operationId: delete-otelcol
      parameters:
        - description: Name to greet
          in: path
          name: id
          required: true
          schema:
            description: Name to greet
            example: world
            maxLength: 30
            type: string
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: delete otelcol
    get:
      operationId: get-otelcol
      parameters:
        - description: otelcol id
          in: path
          name: id
          required: true
          schema:
            description: otelcol id
            example: asdf89d080
            maxLength: 32
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Otelcol"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: get otelcol
    put:
      operationId: update-otelcol
      parameters:
        - description: Name to greet
          in: path
          name: id
          required: true
          schema:
            description: Name to greet
            example: world
            maxLength: 30
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OtelcolPutRequestBody"
        required: true
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: update otelcol
  /api/v1/auth/login:
    post:
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequestBody"
        required: true
      responses:
        "200":
          description: Login Successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: complete the login process
  /api/v1/auth/register:
    post:
      operationId: register
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequestBody"
        required: true
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: complete the register process
  /api/v1/getparams.execute:
    post:
      operationId: get-params
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PluginInput"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PluginOutput"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Get params for argocd application set
