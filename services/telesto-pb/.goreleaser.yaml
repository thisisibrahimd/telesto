project_name: telesto-pb
version: 2

before:
  hooks:
    - go mod tidy

builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin

kos:
  - repositories: ["quay.io/telesto/telesto-pb"]
    base_image: cgr.dev/chainguard/static
    local_domain: "quay.io/telesto"
    tags:
      - "{{.Version}}"
      - "{{.Tag}}"
    labels:
      "org.opencontainers.image.description": "Extended PocketBase"
      "org.opencontainers.image.created": "{{.Date}}"
      "org.opencontainers.image.name": "telesto-pb"
      # "org.opencontainers.image.revision": "{{.FullCommit}}"
      "org.opencontainers.image.version": "{{.Version}}"
      # "org.opencontainers.image.source": "{{.GitURL}}"
      
    # bare: true
    # preserve_import_paths: false
    base_import_paths: true
    platforms:
      - linux/amd64
      - linux/arm64

archives:
  - formats: [tar.gz]
    # this name template makes the OS and Arch compatible with the results of `uname`.
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os | tolower }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
